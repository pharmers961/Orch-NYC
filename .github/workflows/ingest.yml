name: Scheduled event ingest

# Runs the scraper on a timer, then publishes events.json to the `data` branch.
# The app fetches that file directly (no database).
#
# Optional repository secrets (Settings -> Secrets and variables -> Actions):
#   TICKETMASTER_KEY  enables the Ticketmaster feed
#   GEMINI_API_KEY    enables AI extraction for pages without structured data
# With neither set, the scraper still imports any sites that expose schema.org data.

on:
  schedule:
    - cron: "0 * * * *" # hourly, on the hour (UTC)
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Scrape events
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/ingest.ts

      - name: Publish events.json to data branch
        run: |
          test -f events.json || { echo "::error::events.json was not produced"; exit 1; }
          cp events.json /tmp/events.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data || true
          git checkout data 2>/dev/null || git checkout --orphan data
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/events.json events.json
          git add events.json
          git commit -m "data: update events.json [skip ci]" || { echo "No changes"; exit 0; }
          git push -f origin HEAD:data
